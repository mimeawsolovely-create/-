<!doctype html>
<html lang="th"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101b31"><title>ไปลอยกระทงด้วยกันไหมครับ?</title><link rel="stylesheet" href="style.css">
</head><body>
<div class="moon"></div><div class="stars">✦　　·　✧　　 ·　　✦</div>
<main class="card">
<div class="tag">A LITTLE INVITATION</div><div class="lantern">🏮</div>
<p class="eyebrow">มีเรื่องอยากชวนครับ</p>
<h1>ไปลอยกระทง<br>ด้วยกันไหม?</h1>
<p class="message">ปีนี้ผมอยากชวนคุณไปลอยกระทงด้วยกัน<br>ถ้าคุณว่าง ไปใช้เวลาดี ๆ ด้วยกันนะครับ</p>
<div class="actions"><button class="yes-button" id="yesButton">ไปด้วยกันครับ</button><button class="no-button" id="noButton">ขอคิดดูก่อน</button></div>
<p class="hint" id="hint">หวังว่าจะได้ไปด้วยกันนะครับ</p><p class="footer">a small invitation, just for you</p>
</main>
<section class="success hidden" id="success" role="dialog" aria-modal="true">
<div class="success-card"><div class="success-icon">🌕 🪷</div><h2>ดีใจที่ตอบตกลงครับ</h2><p>งั้นเราไปลอยกระทงด้วยกันนะครับ :)</p><span>ผมรอวันนั้นเลย</span><button id="closeButton">ตกลงครับ</button></div>
</section><script src="script.js"></script></body></html>
